<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting to EventPulse</title>
    <script>
      (function () {
        var segments = window.location.pathname.split("/").filter(Boolean);
        var base = segments.length ? "/" + segments[0] : "";
        var route = "/" + segments.slice(1).join("/");
        var target = base + "/?p=" + encodeURIComponent(route || "/") + window.location.search + window.location.hash;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>Redirecting to EventPulse…</body>
</html>
